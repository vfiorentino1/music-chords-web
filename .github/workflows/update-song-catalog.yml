name: Update song catalog

on:
  push:
    branches: [main]
    paths:
      - 'songs/**/*.md'
      - 'tools/build_song_catalog.py'
      - '.github/workflows/update-song-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild catalog
        run: python tools/build_song_catalog.py
      - name: Commit catalog if changed
        run: |
          if ! git diff --quiet -- songs/songs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add songs/songs.json
            git commit -m "chore: auto-update song catalog"
            git push
          fi
